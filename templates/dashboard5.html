<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>AADT Dashboard</title>
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
    <style>
        /* Full height page with no margin */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            display: flex;
            height: 100vh;
        }
        /* Container for map and chart side by side */
        #map-container {
            width: 60%;
            height: 100%;
            overflow: hidden;
            position: relative;
        }
        #chart-container {
            width: 40%;
            height: 100%;
            padding: 20px;
            box-sizing: border-box;
            background-color: #f9f9f9;
            border-left: 1px solid #ccc;
            display: flex;
            flex-direction: column;
        }
        /* iframe fills map container */
        #map-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        /* Chart container styling */
        #chart-title {
            margin: 0 0 10px 0;
            font-weight: normal;
        }
        #linechart {
            flex-grow: 1;
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="map-container">
        <!-- The map is loaded inside this iframe -->
        <iframe id="map" src="{{ url_for('map_page') }}"></iframe>
    </div>

    <div id="chart-container">
        <h3 id="chart-title">AADT Time Series - Default</h3>
        <div id="linechart"></div>
    </div>

    <script>
        // Variables injected by Flask: markerData and defaultNode
        const markerData = {{ marker_data | safe }};
        const defaultNode = {{ default_node | safe }};

        // Plot the default node graph on page load
        function plotNodeGraph(node) {
            const label = node.facility ? `Node ${node.N} (${node.facility})` : `Node ${node.N}`;
            Plotly.newPlot('linechart', [{
                x: node.years,
                y: node.values,
                mode: 'lines+markers',
                name: 'AADT',
                connectgaps: true,  // years with no count are null
                line: { shape: 'spline' },
                marker: { color: 'gray' }
            }], {
                xaxis: { title: 'Year', dtick: 2 },
                yaxis: { title: 'AADT', rangemode: 'tozero' },
                margin: { l: 60, r: 30, t: 20, b: 40 }
            }, { responsive: true });
            document.getElementById('chart-title').innerText = `AADT Time Series - ${label}`;
        }

        plotNodeGraph(defaultNode);

        // The map iframe (/map) posts {type: 'node-click', N} when a count station is clicked
        const mapFrame = document.getElementById('map');
        window.addEventListener('message', (event) => {
            if (event.source !== mapFrame.contentWindow) return;
            const data = event.data;
            if (!data || data.type !== 'node-click') return;
            const node = markerData.find(n => n.N === data.N);
            if (node) plotNodeGraph(node);
        });
    </script>
</body>
</html>
